<script type="text/babel">
const { useState, useRef, useEffect } = React;

const GRID = 64;
const LAYERS = 64;
const DOT_RADIUS = 2.5;
const SPACING = 3.5;
const CANVAS_SIZE = 700;
const FOG_COLOR = {r:255, g:255, b:255};
const MAX_LIGHTS = 4;
const EPSILON = 0.0001;

const MS_PAINT_COLORS = [
  '#000000', '#7f7f7f', '#880015', '#ed1c24', '#ff7f27', '#fff200', '#22b14c', '#00a2e8', '#3f48cc', '#a349a4', '#ffffff', '#c3c3c3', '#b97a57', '#ffaec9',
  '#404040', '#b5b5b5', '#b97a57', '#f4cccc', '#ffc90e', '#efe4b0', '#b5e61d', '#99d9ea', '#7092be', '#c8bfe7', '#e5e5e5', '#d9d2e9', '#ead1dc', '#fce5cd'
];

const LIGHT_COLOR_PRESETS = [
  '#ffffff', '#ffeedd', '#ffeecc', '#ddffff', '#ffddff', '#ddffdd', '#ffdddd', '#ffffdd'
];

const key = (x,y,z) => `${x},${y},${z}`;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const isFiniteNum = v => typeof v === 'number' && isFinite(v);
const safeNum = (v, fallback = 0) => isFiniteNum(v) ? v : fallback;

const normalize = v => {
  const l = Math.hypot(v.x, v.y, v.z);
  if (l < EPSILON) return {x: 0, y: -1, z: 0};
  return {x: v.x / l, y: v.y / l, z: v.z / l};
};

const dot = (a,b) => a.x*b.x + a.y*b.y + a.z*b.z;

const hexToRgb = h => {
  try {
    const s = h.replace('#','');
    return {
      r: safeNum(parseInt(s.slice(0,2),16), 0),
      g: safeNum(parseInt(s.slice(2,4),16), 0),
      b: safeNum(parseInt(s.slice(4,6),16), 0)
    };
  } catch(e) {
    return {r: 200, g: 200, b: 200};
  }
};

const createDefaultLights = () => [
  { id: 1, name: 'Key Light', x: 32, y: 5, z: 50, type: 'point', color: '#ffffff', intensity: 1.0, enabled: true },
  { id: 2, name: 'Fill Light', x: 55, y: 15, z: 20, type: 'point', color: '#cce7ff', intensity: 0.6, enabled: true },
  { id: 3, name: 'Rim Light', x: 10, y: 10, z: 55, type: 'point', color: '#ffebcc', intensity: 0.5, enabled: false }
];

const project = (x, y, z, rotX, rotY, rotZ) => {
  let px = x - GRID/2, py = y - GRID/2, pz = z - GRID/2;
  const rx = rotX * Math.PI / 180;
  let y1 = py * Math.cos(rx) - pz * Math.sin(rx);
  let z1 = py * Math.sin(rx) + pz * Math.cos(rx);
  py = y1; pz = z1;
  const ry = rotY * Math.PI / 180;
  let x2 = px * Math.cos(ry) + pz * Math.sin(ry);
  let z2 = -px * Math.sin(ry) + pz * Math.cos(ry);
  px = x2; pz = z2;
  const rz = rotZ * Math.PI / 180;
  let x3 = px * Math.cos(rz) - py * Math.sin(rz);
  let y3 = px * Math.sin(rz) + py * Math.cos(rz);
  px = x3; py = y3;
  return { 
    x: safeNum(px), 
    y: safeNum(py - pz * 0.4), 
    z: safeNum(pz) 
  };
};

const getStraightANormal = (px, py, pz, cx, cy, cz) => {
  const crossY = cy + 5;
  const segDist = (x, y, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    if (l2 < EPSILON) return Math.hypot(x - ax, y - ay);
    let t = ((x - ax) * dx + (y - ay) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - (ax + t * dx), y - (ay + t * dy));
  };
  const ldx = cx - (cx - 19), ldy = (cy - 20) - (cy + 20);
  const llen = Math.hypot(ldx, ldy) || 1;
  const rdx = (cx + 19) - cx, rdy = (cy + 20) - (cy - 20);
  const rlen = Math.hypot(rdx, rdy) || 1;
  let n;
  if (Math.abs(py - crossY) <= 4 && px >= cx - 14 && px <= cx + 14) {
    n = {x: 0, y: -1, z: 0};
  } else if (segDist(px, py, cx - 19, cy + 20, cx, cy - 20) <= 
             segDist(px, py, cx, cy - 20, cx + 19, cy + 20)) {
    n = {x: -ldy / llen, y: ldx / llen, z: 0};
  } else {
    n = {x: -rdy / rlen, y: rdx / rlen, z: 0};
  }
  if (Math.abs(pz - cz) >= 8) {
    n = {x: 0, y: 0, z: pz >= cz ? 1 : -1};
  }
  return normalize(n);
};

const getPlaneNormal = () => ({x: 0, y: 0, z: 1});

const getLightDirection = (x, y, z, lx, ly, lz, type) => {
  if (type === 'hemisphere') return {x: 0, y: -1, z: 0};
  const dx = lx - x, dy = ly - y, dz = lz - z;
  const len = Math.hypot(dx, dy, dz);
  if (len < EPSILON) return {x: 0, y: -1, z: 0};
  return {x: dx / len, y: dy / len, z: dz / len};
};

const phongShadeMulti = (x, y, z, lights, cx, cy, cz, base, power, inten) => {
  const isPlane = z < cz - 10.5;
  const n = isPlane ? getPlaneNormal() : getStraightANormal(x, y, z, cx, cy, cz);
  const v = normalize({x: cx - x, y: cy - y, z: 80 - z});
  const c = hexToRgb(base);
  
  const getEdgeFactor = (px, py, pz, cx, cy) => {
    if (pz < cz - 10.5) return 0;
    const crossY = cy + 5;
    const d = Math.min(Math.abs(py - (cy - 20)), Math.abs(py - (cy + 20)), Math.abs(py - crossY));
    return Math.max(0, 1 - d / 6);
  };
  const edge = getEdgeFactor(x, y, z, cx, cy);
  const edgeLift = 1 + edge * 0.22;
  
  let result = {r: 0, g: 0, b: 0};
  const enabledLights = lights.filter(l => l.enabled);
  
  if (enabledLights.length === 0) {
    const ambient = 0.15;
    return {
      r: clamp(c.r * ambient, 0, 255),
      g: clamp(c.g * ambient, 0, 255),
      b: clamp(c.b * ambient, 0, 255)
    };
  }
  
  for (const light of enabledLights) {
    const lc = hexToRgb(light.color);
    const li = safeNum(light.intensity, 1);
    const lr = lc.r / 255, lg = lc.g / 255, lb = lc.b / 255;
    
    const evaluate = (L, weight = 1) => {
      const hx = L.x + v.x, hy = L.y + v.y, hz = L.z + v.z;
      const hlen = Math.hypot(hx, hy, hz);
      const h = hlen > EPSILON ? {x: hx/hlen, y: hy/hlen, z: hz/hlen} : {x:0, y:-1, z:0};
      
      const nDotL = dot(n, L);
      const diff = Math.max(0.15, nDotL);
      const nDotH = dot(n, h);
      let spec = nDotH > 0.1 ? Math.pow(nDotH, power) : 0;
      
      const nDotV = Math.abs(dot(n, v));
      const grazing = isPlane ? 0 : Math.pow(Math.max(0, 1 - nDotV), 3.5) * edge * 0.42;
      spec = Math.min(1.5, spec * edgeLift + grazing);
      
      const w = weight * li;
      return {
        r: (c.r * diff * edgeLift * lr + 255 * spec * inten * lr) * w,
        g: (c.g * diff * edgeLift * lg + 255 * spec * inten * lg) * w,
        b: (c.b * diff * edgeLift * lb + 255 * spec * inten * lb) * w
      };
    };
    
    if (light.type === 'point') {
      const L = getLightDirection(x, y, z, light.x, light.y, light.z, 'point');
      const q = evaluate(L, 1);
      result.r += q.r; result.g += q.g; result.b += q.b;
    }
    if (light.type === 'area') {
      const s = 8;
      const samples = [
        {x: light.x - s, y: light.y, z: light.z - s},
        {x: light.x + s, y: light.y, z: light.z - s},
        {x: light.x - s, y: light.y, z: light.z + s},
        {x: light.x + s, y: light.y, z: light.z + s},
        {x: light.x, y: light.y + s * 0.5, z: light.z}
      ];
      for (const p of samples) {
        const L = normalize({x: p.x - x, y: p.y - y, z: p.z - z});
        const q = evaluate(L, 1 / samples.length);
        result.r += q.r; result.g += q.g; result.b += q.b;
      }
    }
    if (light.type === 'hemisphere') {
      const up = {x: 0, y: -1, z: 0};
      const down = {x: 0, y: 1, z: 0};
      const nDotUp = dot(n, up);
      const nDotDown = dot(n, down);
      const topAmount = 0.72 * (0.5 + 0.5 * nDotUp);
      const bottomAmount = 0.28 * (0.5 + 0.5 * nDotDown);
      const top = evaluate(up, topAmount);
      const bottom = evaluate(down, bottomAmount);
      result.r += top.r + bottom.r;
      result.g += top.g + bottom.g;
      result.b += top.b + bottom.b;
    }
  }
  
  return {
    r: clamp(safeNum(result.r, 0), 0, 255),
    g: clamp(safeNum(result.g, 0), 0, 255),
    b: clamp(safeNum(result.b, 0), 0, 255)
  };
};

const bulletShadeMulti = (x, y, z, lights, cx, cy, cz, base, rough) => {
  const isPlane = z < cz - 10.5;
  const n = isPlane ? getPlaneNormal() : getStraightANormal(x, y, z, cx, cy, cz);
  const v = normalize({x: cx - x, y: cy - y, z: 80 - z});
  const c = hexToRgb(base);
  
  let result = {r: 0, g: 0, b: 0};
  const enabledLights = lights.filter(l => l.enabled);
  if (enabledLights.length === 0) return {r: 0, g: 0, b: 0};
  
  const specPower = Math.max(10, 90 / (rough + 0.15));
  const diffFactor = 1 - rough;
  
  for (const light of enabledLights) {
    const lc = hexToRgb(light.color);
    const li = safeNum(light.intensity, 1);
    const L = getLightDirection(x, y, z, light.x, light.y, light.z, light.type);
    
    const hx = L.x + v.x, hy = L.y + v.y, hz = L.z + v.z;
    const hlen = Math.hypot(hx, hy, hz);
    const h = hlen > EPSILON ? {x: hx/hlen, y: hy/hlen, z: hz/hlen} : {x:0, y:-1, z:0};
    
    const nDotL = Math.abs(dot(n, L));
    const diff = Math.max(0.1, nDotL) * diffFactor;
    const nDotH = dot(n, h);
    const spec = nDotH > 0 ? Math.pow(nDotH, specPower) : 0;
    
    result.r += (c.r * diff * (lc.r/255) + 220 * spec * (lc.r/255)) * li;
    result.g += (c.g * diff * (lc.g/255) + 215 * spec * (lc.g/255)) * li;
    result.b += (c.b * diff * (lc.b/255) + 210 * spec * (lc.b/255)) * li;
  }
  
  return {
    r: clamp(safeNum(result.r, 0), 0, 255),
    g: clamp(safeNum(result.g, 0), 0, 255),
    b: clamp(safeNum(result.b, 0), 0, 255)
  };
};

const glassShadeMulti = (x, y, z, lights, cx, cy, cz, base, strength) => {
  const isPlane = z < cz - 10.5;
  const n = isPlane ? getPlaneNormal() : getStraightANormal(x, y, z, cx, cy, cz);
  const v = normalize({x: cx - x, y: cy - y, z: 80 - z});
  const nDotV = Math.abs(dot(n, v));
  const fres = Math.pow(1 - Math.max(0, nDotV), 3.5);
  const c = hexToRgb(base);
  
  let colorTint = {r: 0, g: 0, b: 0};
  const enabledLights = lights.filter(l => l.enabled);
  let totalIntensity = 0;
  
  for (const light of enabledLights) {
    const lc = hexToRgb(light.color);
    const li = safeNum(light.intensity, 1);
    colorTint.r += lc.r * li;
    colorTint.g += lc.g * li;
    colorTint.b += lc.b * li;
    totalIntensity += li;
  }
  
  if (totalIntensity > EPSILON) {
    colorTint.r /= totalIntensity;
    colorTint.g /= totalIntensity;
    colorTint.b /= totalIntensity;
  } else {
    colorTint = {r: 255, g: 255, b: 255};
  }
  
  return {
    r: clamp(safeNum(c.r * 0.55 + fres * 130 * strength * (colorTint.r / 255), 0), 0, 255),
    g: clamp(safeNum(c.g * 0.55 + fres * 150 * strength * (colorTint.g / 255), 0), 0, 255),
    b: clamp(safeNum(c.b * 0.65 + fres * 170 * strength * (colorTint.b / 255), 0), 0, 255)
  };
};

const refractSeetruMulti = (x, y, z, lights, cx, cy, cz, base, ior, strength) => {
  const isPlane = z < cz - 10.5;
  const n = isPlane ? getPlaneNormal() : getStraightANormal(x, y, z, cx, cy, cz);
  const v = normalize({x: cx - x, y: cy - y, z: 80 - z});
  const c = hexToRgb(base);
  const depthFactor = Math.exp(-Math.hypot(x - cx, y - cy, z - cz) / 10);
  
  let result = {r: 0, g: 0, b: 0, intensity: 0};
  const enabledLights = lights.filter(l => l.enabled);
  
  for (const light of enabledLights) {
    const lc = hexToRgb(light.color);
    const li = safeNum(light.intensity, 1);
    const L = getLightDirection(x, y, z, light.x, light.y, light.z, light.type);
    const cosTheta = dot(n, L);
    
    if (cosTheta >= 0) continue;
    
    const eta = 1 / ior;
    const k = 1 - eta * eta * (1 - cosTheta * cosTheta);
    
    if (k < 0) continue;
    
    const sqrtK = Math.sqrt(k);
    const rdx = eta * L.x - (eta * cosTheta + sqrtK) * n.x;
    const rdy = eta * L.y - (eta * cosTheta + sqrtK) * n.y;
    const rdz = eta * L.z - (eta * cosTheta + sqrtK) * n.z;
    const refractDir = normalize({x: rdx, y: rdy, z: rdz});
    
    const rDotV = dot(refractDir, v);
    const intensity = Math.max(0, rDotV) * strength * li;
    
    result.r += c.r * intensity * depthFactor * (lc.r / 255);
    result.g += c.g * intensity * depthFactor * (lc.g / 255);
    result.b += c.b * intensity * depthFactor * (lc.b / 255);
    result.intensity += intensity;
  }
  
  return {
    r: safeNum(result.r, 0),
    g: safeNum(result.g, 0),
    b: safeNum(result.b, 0),
    intensity: safeNum(result.intensity, 0)
  };
};

const createLetterA = (c = '#00a2e8') => {
  const m = new Map();
  const cen = GRID / 2;
  const thickness = 3;
  const zMin = cen - 10, zMax = cen + 10;
  const top = cen - 20, bottom = cen + 20;
  const left = cen - 19, right = cen + 19;
  const apexX = cen, crossY = cen + 5;
  
  const pointSegmentDistance = (px, py, ax, ay, bx, by) => {
    const abx = bx - ax, aby = by - ay;
    const l2 = abx * abx + aby * aby;
    if (l2 < EPSILON) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * abx + (py - ay) * aby) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + abx * t), py - (ay + aby * t));
  };
  
  for (let x = cen - 24; x <= cen + 24; x++) {
    for (let y = cen - 22; y <= cen + 22; y++) {
      const leftDist = pointSegmentDistance(x, y, left, bottom, apexX, top);
      const rightDist = pointSegmentDistance(x, y, right, bottom, apexX, top);
      const isLeg = leftDist <= thickness || rightDist <= thickness;
      const isCrossbar = Math.abs(y - crossY) <= thickness && x >= cen - 13 && x <= cen + 13;
      if (isLeg || isCrossbar) {
        for (let z = zMin; z <= zMax; z++) {
          m.set(key(x, y, z), c);
        }
      }
    }
  }
  return m;
};

const createBackPlane = (darkness = 0.22) => {
  const m = new Map();
  const cen = GRID / 2;
  const planeZ = cen - 11;
  const size = 45;
  
  // Base plane color: gray scaled by darkness (0=white, 1=black)
  const base = Math.round(255 * (1 - darkness));
  const planeColor = `rgb(${base},${base},${base})`;
  
  for (let x = cen - size; x <= cen + size; x++) {
    for (let y = cen - size; y <= cen + size; y++) {
      m.set(key(x, y, planeZ), planeColor);
    }
  }
  return m;
};

const updateAllDotsColor = (dots, newColor, planeDarkness = 0.22) => {
  const updated = new Map();
  const cen = GRID / 2;
  const planeZ = cen - 11;
  const base = Math.round(255 * (1 - planeDarkness));
  const planeColor = `rgb(${base},${base},${base})`;
  
  for (const [pos, col] of dots) {
    const parts = pos.split(',');
    const z = parseInt(parts[2], 10);
    if (z === planeZ) {
      updated.set(pos, planeColor);
    } else {
      updated.set(pos, newColor);
    }
  }
  return updated;
};

const LockableSlider = ({label, value, onChange, min, max, step, locked, onToggleLock}) => (
  <div className="control-item">
    <div className="control-row">
      <label>{label}: {typeof value === 'number' ? value.toFixed(step < 1 ? 2 : 0) : value}</label>
      <button 
        className={`lock-btn ${locked ? 'locked' : 'unlocked'}`} 
        onClick={onToggleLock}
        title={locked ? 'Unlock slider' : 'Lock slider'}
      >
        {locked ? '🔒 Locked' : '🔓 Unlocked'}
      </button>
    </div>
    <input 
      type="range" 
      min={min} max={max} step={step} 
      value={value}
      onChange={onChange} 
      disabled={locked}
    />
  </div>
);

function App() {
  const [planeDarkness, setPlaneDarkness] = useState(0.22);
  
  const [dots, setDots] = useState(() => {
    const letter = createLetterA('#00a2e8');
    const plane = createBackPlane(0.22);
    return new Map([...plane, ...letter]);
  });
  const [color, setColor] = useState('#00a2e8');
  const [rotX, setRotX] = useState(20);
  const [rotY, setRotY] = useState(45);
  const [rotZ, setRotZ] = useState(0);
  const [lights, setLights] = useState(createDefaultLights);
  const [activeLightId, setActiveLightId] = useState(1);
  
  const [phongPower, setPhongPower] = useState(160);
  const [phongInten, setPhongInten] = useState(1.6);
  const [phongOpacity, setPhongOpacity] = useState(1.0);
  const [bulletOpacity, setBulletOpacity] = useState(0.0);
  const [roughness, setRoughness] = useState(0.25);
  const [glassOpacity, setGlassOpacity] = useState(0.0);
  const [glassStrength, setGlassStrength] = useState(0.8);
  const [ior, setIor] = useState(1.52);
  const [refractStrength, setRefractStrength] = useState(0.6);
  const [fogAmount, setFogAmount] = useState(0.15);
  
  const [glowStrength, setGlowStrength] = useState(0.9);
  const [glowRadius, setGlowRadius] = useState(20);
  const [glowTint, setGlowTint] = useState(1.0);
  const [glowSaturation, setGlowSaturation] = useState(1.4);
  
  const [fps, setFps] = useState(60);
  
  const [locks, setLocks] = useState({
    rotX: false, rotY: false, rotZ: false,
    phongPower: false, phongInten: false, phongOpacity: false,
    bulletOpacity: false, roughness: false,
    glassOpacity: false, glassStrength: false, ior: false, refractStrength: false,
    fogAmount: false, glowStrength: false, glowRadius: false, glowTint: false,
    glowSaturation: false, planeDarkness: false
  });
  
  const toggleLock = k => setLocks(p => ({...p, [k]: !p[k]}));
  
  const handleColorChange = c => {
    setColor(c);
    setDots(p => updateAllDotsColor(p, c, planeDarkness));
  };
  
  const handlePlaneDarknessChange = d => {
    setPlaneDarkness(d);
    setDots(p => updateAllDotsColor(p, color, d));
  };
  
  const activeLight = lights.find(l => l.id === activeLightId) || lights[0];
  
  const updateActiveLight = (updates) => {
    setLights(prev => prev.map(l => 
      l.id === activeLightId ? { ...l, ...updates } : l
    ));
  };
  
  const addLight = () => {
    if (lights.length >= MAX_LIGHTS) return;
    const newId = Math.max(...lights.map(l => l.id)) + 1;
    const lightNames = ['Key Light', 'Fill Light', 'Rim Light', 'Back Light', 'Top Light'];
    const colors = ['#ffffff', '#cce7ff', '#ffebcc', '#ffccdd', '#ccffdd'];
    const positions = [
      { x: 32, y: 5, z: 50 },
      { x: 55, y: 15, z: 20 },
      { x: 10, y: 10, z: 55 },
      { x: 32, y: 5, z: 15 },
      { x: 32, y: 50, z: 32 }
    ];
    const idx = lights.length;
    const newLight = {
      id: newId,
      name: lightNames[idx] || `Light ${newId}`,
      x: positions[idx]?.x || 32,
      y: positions[idx]?.y || 10,
      z: positions[idx]?.z || 40,
      type: 'point',
      color: colors[idx] || '#ffffff',
      intensity: 0.7,
      enabled: true
    };
    setLights(prev => [...prev, newLight]);
    setActiveLightId(newId);
  };
  
  const removeLight = (id) => {
    if (lights.length <= 1) return;
    const remaining = lights.filter(l => l.id !== id);
    setLights(remaining);
    if (activeLightId === id) {
      setActiveLightId(remaining[0].id);
    }
  };
  
  const toggleLightEnabled = (id) => {
    setLights(prev => prev.map(l => 
      l.id === id ? { ...l, enabled: !l.enabled } : l
    ));
  };
  
  const canvasRef = useRef(null);
  const glowCanvasRef = useRef(null);
  const maskCanvasRef = useRef(null);
  const animRef = useRef(null);
  const timeRef = useRef(0);
  const frameCountRef = useRef(0);
  const lastFpsRef = useRef(performance.now());
  
  const paramsRef = useRef({
    dots, rotX, rotY, rotZ, lights, color,
    phongPower, phongInten, phongOpacity,
    bulletOpacity, roughness,
    glassOpacity, glassStrength, ior, refractStrength,
    fogAmount, glowStrength, glowRadius, glowTint, glowSaturation
  });
  
  useEffect(() => {
    paramsRef.current = {
      dots, rotX, rotY, rotZ, lights, color,
      phongPower, phongInten, phongOpacity,
      bulletOpacity, roughness,
      glassOpacity, glassStrength, ior, refractStrength,
      fogAmount, glowStrength, glowRadius, glowTint, glowSaturation
    };
  });
  
  // Boost color saturation for the glow
  const saturateColor = (r, g, b, factor) => {
    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    return {
      r: clamp(Math.round(gray + (r - gray) * factor), 0, 255),
      g: clamp(Math.round(gray + (g - gray) * factor), 0, 255),
      b: clamp(Math.round(gray + (b - gray) * factor), 0, 255)
    };
  };
  
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) return;
    
    const glowCanvas = glowCanvasRef.current;
    if (!glowCanvas) return;
    const glowCtx = glowCanvas.getContext('2d', { alpha: true });
    if (!glowCtx) return;
    
    const maskCanvas = maskCanvasRef.current;
    if (!maskCanvas) return;
    const maskCtx = maskCanvas.getContext('2d', { alpha: false });
    if (!maskCtx) return;
    
    const cx = CANVAS_SIZE / 2;
    const cy = CANVAS_SIZE / 2;
    const cen = GRID / 2;
    const maxDepth = GRID;
    
    const render = () => {
      const now = performance.now();
      frameCountRef.current++;
      
      if (now - lastFpsRef.current >= 1000) {
        setFps(frameCountRef.current);
        frameCountRef.current = 0;
        lastFpsRef.current = now;
      }
      
      timeRef.current += 16;
      const p = paramsRef.current;
      
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      
      const planeList = [];
      const letterList = [];
      
      for (const [k, baseCol] of p.dots) {
        const parts = k.split(',');
        const x = parseInt(parts[0], 10);
        const y = parseInt(parts[1], 10);
        const z = parseInt(parts[2], 10);
        const proj = project(x, y, z, p.rotX, p.rotY, p.rotZ);
        const item = {
          x, y, z, baseCol,
          px: proj.x, py: proj.y, pz: proj.z,
          depth: proj.z
        };
        if (z < cen - 10.5) {
          planeList.push(item);
        } else {
          letterList.push(item);
        }
      }
      
      planeList.sort((a, b) => a.depth - b.depth);
      letterList.sort((a, b) => a.depth - b.depth);
      
      // === RENDER PLANE ===
      for (const d of planeList) {
        try {
          const phong = phongShadeMulti(
            d.x, d.y, d.z, p.lights, cen, cen, cen,
            d.baseCol, p.phongPower, p.phongInten
          );
          const bullet = bulletShadeMulti(
            d.x, d.y, d.z, p.lights, cen, cen, cen,
            d.baseCol, p.roughness
          );
          const glass = glassShadeMulti(
            d.x, d.y, d.z, p.lights, cen, cen, cen,
            d.baseCol, p.glassStrength
          );
          
          let rr = phong.r * p.phongOpacity + bullet.r * p.bulletOpacity + glass.r * p.glassOpacity;
          let gg = phong.g * p.phongOpacity + bullet.g * p.bulletOpacity + glass.g * p.glassOpacity;
          let bb = phong.b * p.phongOpacity + bullet.b * p.bulletOpacity + glass.b * p.glassOpacity;
          
          const depthFactor = (d.depth + maxDepth / 2) / maxDepth;
          const fogFactor = depthFactor * p.fogAmount;
          rr = rr * (1 - fogFactor) + FOG_COLOR.r * fogFactor;
          gg = gg * (1 - fogFactor) + FOG_COLOR.g * fogFactor;
          bb = bb * (1 - fogFactor) + FOG_COLOR.b * fogFactor;
          
          const drawX = cx + d.px * SPACING;
          const drawY = cy + d.py * SPACING;
          
          if (!isFinite(drawX) || !isFinite(drawY)) continue;
          
          rr = clamp(Math.round(rr), 0, 255);
          gg = clamp(Math.round(gg), 0, 255);
          bb = clamp(Math.round(bb), 0, 255);
          
          ctx.beginPath();
          ctx.arc(drawX, drawY, DOT_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
          ctx.fill();
        } catch (e) {
          continue;
        }
      }
      
      // === VOXEL-ONLY GLOW PIPELINE (ENHANCED VISIBILITY) ===
      if (p.glowStrength > 0.01 && p.glowRadius > 0.5) {
        // Step 1: Build voxel mask — white where voxels exist, black elsewhere
        maskCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        maskCtx.fillStyle = '#000000';
        maskCtx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        maskCtx.fillStyle = '#ffffff';
        
        const allVoxels = [...planeList, ...letterList];
        for (const d of allVoxels) {
          const drawX = cx + d.px * SPACING;
          const drawY = cy + d.py * SPACING;
          if (!isFinite(drawX) || !isFinite(drawY)) continue;
          maskCtx.beginPath();
          // Generous mask radius to catch blurred glow edges
          maskCtx.arc(drawX, drawY, DOT_RADIUS * 3.0 + p.glowRadius * 0.5, 0, Math.PI * 2);
          maskCtx.fill();
        }
        
        // Step 2: Draw SUPER-BRIGHT letter glow source to glow canvas
        glowCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        const letterColor = hexToRgb(p.color);
        
        // Apply saturation boost + tint
        let tintR = letterColor.r * p.glowTint + 255 * (1 - p.glowTint);
        let tintG = letterColor.g * p.glowTint + 255 * (1 - p.glowTint);
        let tintB = letterColor.b * p.glowTint + 255 * (1 - p.glowTint);
        
        // Saturate the glow color
        const saturated = saturateColor(tintR, tintG, tintB, p.glowSaturation);
        
        // Draw glow source — multiple passes for brightness
        for (let pass = 0; pass < 3; pass++) {
          const sizeMult = 2.5 + pass * 0.8;
          const alpha = 1.0 - pass * 0.25;
          glowCtx.globalAlpha = alpha;
          
          for (const d of letterList) {
            const drawX = cx + d.px * SPACING;
            const drawY = cy + d.py * SPACING;
            if (!isFinite(drawX) || !isFinite(drawY)) continue;
            glowCtx.beginPath();
            glowCtx.arc(drawX, drawY, DOT_RADIUS * sizeMult, 0, Math.PI * 2);
            glowCtx.fillStyle = `rgb(${saturated.r},${saturated.g},${saturated.b})`;
            glowCtx.fill();
          }
        }
        glowCtx.globalAlpha = 1;
        
        // Step 3: Blur the glow (do it twice for extra softness)
        glowCtx.save();
        glowCtx.filter = `blur(${p.glowRadius}px)`;
        glowCtx.drawImage(glowCanvas, 0, 0);
        glowCtx.filter = `blur(${p.glowRadius * 0.5}px)`;
        glowCtx.drawImage(glowCanvas, 0, 0);
        glowCtx.restore();
        
        // Step 4: Apply mask — glow survives ONLY where voxels exist
        glowCtx.save();
        glowCtx.globalCompositeOperation = 'destination-in';
        glowCtx.drawImage(maskCanvas, 0, 0);
        glowCtx.restore();
        
        // Step 5: Composite masked glow onto main canvas
        // 'lighter' = additive blend, works great on gray surfaces
        ctx.save();
        ctx.globalAlpha = p.glowStrength;
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(glowCanvas, 0, 0);
        ctx.restore();
      }
      
      // === RENDER LETTER ON TOP ===
      for (const d of letterList) {
        try {
          const phong = phongShadeMulti(
            d.x, d.y, d.z, p.lights, cen, cen, cen,
            d.baseCol, p.phongPower, p.phongInten
          );
          const bullet = bulletShadeMulti(
            d.x, d.y, d.z, p.lights, cen, cen, cen,
            d.baseCol, p.roughness
          );
          const glass = glassShadeMulti(
            d.x, d.y, d.z, p.lights, cen, cen, cen,
            d.baseCol, p.glassStrength
          );
          const refract = refractSeetruMulti(
            d.x, d.y, d.z, p.lights, cen, cen, cen,
            d.baseCol, p.ior, p.refractStrength
          );
          
          let rr = phong.r * p.phongOpacity + bullet.r * p.bulletOpacity + 
                   glass.r * p.glassOpacity + refract.r * p.glassOpacity;
          let gg = phong.g * p.phongOpacity + bullet.g * p.bulletOpacity + 
                   glass.g * p.glassOpacity + refract.g * p.glassOpacity;
          let bb = phong.b * p.phongOpacity + bullet.b * p.bulletOpacity + 
                   glass.b * p.glassOpacity + refract.b * p.glassOpacity;
          
          const depthFactor = (d.depth + maxDepth / 2) / maxDepth;
          const fogFactor = depthFactor * p.fogAmount;
          rr = rr * (1 - fogFactor) + FOG_COLOR.r * fogFactor;
          gg = gg * (1 - fogFactor) + FOG_COLOR.g * fogFactor;
          bb = bb * (1 - fogFactor) + FOG_COLOR.b * fogFactor;
          
          const drawX = cx + d.px * SPACING;
          const drawY = cy + d.py * SPACING;
          
          if (!isFinite(drawX) || !isFinite(drawY)) continue;
          
          rr = clamp(Math.round(rr), 0, 255);
          gg = clamp(Math.round(gg), 0, 255);
          bb = clamp(Math.round(bb), 0, 255);
          
          ctx.beginPath();
          ctx.arc(drawX, drawY, DOT_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
          ctx.fill();
        } catch (e) {
          continue;
        }
      }
      
      animRef.current = requestAnimationFrame(render);
    };
    
    animRef.current = requestAnimationFrame(render);
    
    return () => {
      if (animRef.current) {
        cancelAnimationFrame(animRef.current);
        animRef.current = null;
      }
    };
  }, []);
  
  return (
    <>
      <div className="top-bar">
        <div className="palette-wrap">
          <div className="palette">
            {MS_PAINT_COLORS.map(c => (
              <button 
                key={c} 
                className={"swatch " + (color === c ? 'selected' : '')} 
                style={{ background: c }}
                onClick={() => handleColorChange(c)}
              />
            ))}
          </div>
        </div>
        <div className="perf">
          FPS: {fps} | Lights: {lights.filter(l => l.enabled).length}/{lights.length}
        </div>
      </div>

      <div className="preview-box">
        <h3>Voxel Letter A — Visible Voxel-Only Color Bleed</h3>
        <canvas 
          ref={canvasRef} 
          width={CANVAS_SIZE} 
          height={CANVAS_SIZE}
        />
        <canvas 
          ref={glowCanvasRef} 
          width={CANVAS_SIZE} 
          height={CANVAS_SIZE}
          style={{ display: 'none' }}
        />
        <canvas 
          ref={maskCanvasRef} 
          width={CANVAS_SIZE} 
          height={CANVAS_SIZE}
          style={{ display: 'none' }}
        />

        <div className="section-header">VOXEL-ONLY COLOR BLEED GLOW</div>
        <div className="controls">
          <LockableSlider label="Glow Strength"
            value={glowStrength}
            onChange={e => setGlowStrength(+e.target.value)}
            min={0} max={1.5} step={0.01} locked={locks.glowStrength}
            onToggleLock={() => toggleLock('glowStrength')}
          />
          <LockableSlider label="Glow Radius (Blur)"
            value={glowRadius}
            onChange={e => setGlowRadius(+e.target.value)}
            min={0.5} max={40} step={0.5} locked={locks.glowRadius}
            onToggleLock={() => toggleLock('glowRadius')}
          />
          <LockableSlider label="Glow Color Tint"
            value={glowTint}
            onChange={e => setGlowTint(+e.target.value)}
            min={0} max={1} step={0.05} locked={locks.glowTint}
            onToggleLock={() => toggleLock('glowTint')}
          />
          <LockableSlider label="Glow Saturation Boost"
            value={glowSaturation}
            onChange={e => setGlowSaturation(+e.target.value)}
            min={0.5} max={2.5} step={0.05} locked={locks.glowSaturation}
            onToggleLock={() => toggleLock('glowSaturation')}
          />
          <LockableSlider label="Plane Darkness (for visibility)"
            value={planeDarkness}
            onChange={e => handlePlaneDarknessChange(+e.target.value)}
            min={0} max={0.6} step={0.01} locked={locks.planeDarkness}
            onToggleLock={() => toggleLock('planeDarkness')}
          />
        </div>
        <p className="note" style={{marginTop:10}}>
          👁️ <strong>Now clearly visible:</strong> The back plane is light gray instead of pure white, so
          the colored glow bleed shows up vividly. The glow is masked to voxels only — empty space stays clean.
          <br/><br/>
          <strong>Plane Darkness</strong> = darker plane = more visible glow (0 = white, 0.6 = dark gray)<br/>
          <strong>Glow Saturation Boost</strong> = makes the glow color more intense/vivid<br/>
          <strong>Glow Strength</strong> = how bright the bleed is<br/>
          <strong>Glow Radius</strong> = how far color spreads across voxel surfaces
        </p>

        <div className="section-header">MULTI-LIGHT MANAGER</div>
        <div className="light-manager">
          <div className="light-tabs">
            {lights.map(light => (
              <div 
                key={light.id}
                className={`light-tab ${activeLightId === light.id ? 'active' : ''} ${!light.enabled ? 'disabled' : ''}`}
                onClick={() => setActiveLightId(light.id)}
              >
                <span className="dot" style={{ background: light.color }}></span>
                <span>{light.name}</span>
                {lights.length > 1 && (
                  <button 
                    className="close-btn" 
                    onClick={(e) => { e.stopPropagation(); removeLight(light.id); }}
                    title="Remove light"
                  >×</button>
                )}
              </div>
            ))}
          </div>
          
          <div className="light-actions">
            <button 
              className="add-light-btn" 
              onClick={addLight}
              disabled={lights.length >= MAX_LIGHTS}
            >
              + Add Light ({lights.length}/{MAX_LIGHTS})
            </button>
            {activeLight && (
              <button 
                className={`toggle-light-btn ${activeLight.enabled ? 'on' : 'off'}`}
                onClick={() => toggleLightEnabled(activeLight.id)}
              >
                {activeLight.enabled ? '● Enabled' : '○ Disabled'}

          </div>
          
          {activeLight && (
            <>
              <div className="light-type-panel">

                  Editing: <strong>{activeLight.name}</strong>

                <div className="light-color-row">
                  <label>Light Color:</label>
                  <input 
                    type="color" 
                    value={activeLight.color}
                    onChange={(e) => updateActiveLight({ color: e.target.value })}
                  />
                  <div className="palette" style={{ gridTemplateColumns: 'repeat(8, 20px)' }}>
                    {LIGHT_COLOR_PRESETS.map(c => (
                      <button 
                        key={c}
                        className={"swatch " + (activeLight.color === c ? 'selected' : '')}
                        style={{ background: c, width: 20, height: 20 }}
                        onClick={() => updateActiveLight({ color: c })}
                      />
                    ))}
                  </div>
                </div>
                
                <div className="light-intensity-row">
                  <label>Intensity:</label>
                  <input 
                    type="range" 
                    min="0" max="2" step="0.05" 
                    value={activeLight.intensity}
                    onChange={(e) => updateActiveLight({ intensity: parseFloat(e.target.value) })}
                  />
                  <span style={{ fontSize: 12, color: '#666', minWidth: 40 }}>
                    {activeLight.intensity.toFixed(2)}
                  </span>
                </div>
                
                <div className="light-type-title" style={{ marginTop: 10 }}>
                  Light Source Type:
                </div>
                <div className="light-option-row">
                  <label className={`light-option ${activeLight.type === 'point' ? 'active' : ''}`}>
                    <input 
                      type="radio" 
                      checked={activeLight.type === 'point'}
                      onChange={() => updateActiveLight({ type: 'point' })}
                    />
                    Point Light
                  </label>
                  <label className={`light-option ${activeLight.type === 'area' ? 'active' : ''}`}>
                    <input 
                      type="radio" 
                      checked={activeLight.type === 'area'}
                      onChange={() => updateActiveLight({ type: 'area' })}
                    />
                    Area Light
                  </label>
                  <label className={`light-option ${activeLight.type === 'hemisphere' ? 'active' : ''}`}>
                    <input 
                      type="radio" 
                      checked={activeLight.type === 'hemisphere'}
                      onChange={() => updateActiveLight({ type: 'hemisphere' })}
                    />
                    Hemisphere
                  </label>
                </div>
              </div>
              
              <div className="controls">
                <LockableSlider 
                  label={`${activeLight.name} X`}
                  value={activeLight.x}
                  onChange={e => updateActiveLight({ x: +e.target.value })}
                  min={0} max={GRID} step={1} locked={false}
                  onToggleLock={() => {}}
                />
                <LockableSlider 
                  label={`${activeLight.name} Y (Height)`}
                  value={activeLight.y}
                  onChange={e => updateActiveLight({ y: +e.target.value })}
                  min={0} max={GRID} step={1} locked={false}
                  onToggleLock={() => {}}
                />
                <LockableSlider 
                  label={`${activeLight.name} Z (Depth)`}
                  value={activeLight.z}
                  onChange={e => updateActiveLight({ z: +e.target.value })}
                  min={0} max={LAYERS - 1} step={1} locked={false}
                  onToggleLock={() => {}}
                />
              </div>
              
              <div className="multi-light-note">
                Tip: Use Key Light (main, white) + Fill Light (softer, cool blue) + Rim Light (back, warm) 
                for classic 3-point lighting.
              </div>
            </>
          )}
        </div>

        <div className="section-header">ROTATION</div>
        <div className="controls">
          <LockableSlider label="Rotate X"
            value={rotX} onChange={e => setRotX(+e.target.value)}
            min={0} max={360} step={1} locked={locks.rotX}
            onToggleLock={() => toggleLock('rotX')}
          />
          <LockableSlider label="Rotate Y"
            value={rotY} onChange={e => setRotY(+e.target.value)}
            min={0} max={360} step={1} locked={locks.rotY}
            onToggleLock={() => toggleLock('rotY')}
          />
          <LockableSlider label="Rotate Z"
            value={rotZ} onChange={e => setRotZ(+e.target.value)}
            min={0} max={360} step={1} locked={locks.rotZ}
            onToggleLock={() => toggleLock('rotZ')}
          />
        </div>

        <div className="section-header">PHONG SPECULAR</div>
        <div className="controls">
          <LockableSlider label="Sharpness"
            value={phongPower} onChange={e => setPhongPower(+e.target.value)}
            min={40} max={300} step={1} locked={locks.phongPower}
            onToggleLock={() => toggleLock('phongPower')}
          />
          <LockableSlider label="Brightness"
            value={phongInten} onChange={e => setPhongInten(+e.target.value)}
            min={0} max={3} step={0.1} locked={locks.phongInten}
            onToggleLock={() => toggleLock('phongInten')}
          />
          <LockableSlider label="Opacity"
            value={phongOpacity} onChange={e => setPhongOpacity(+e.target.value)}
            min={0} max={1} step={0.05} locked={locks.phongOpacity}
            onToggleLock={() => toggleLock('phongOpacity')}
          />
        </div>

        <div className="section-header">METAL</div>
        <div className="controls">
          <LockableSlider label="Opacity"
            value={bulletOpacity} onChange={e => setBulletOpacity(+e.target.value)}
            min={0} max={1} step={0.05} locked={locks.bulletOpacity}
            onToggleLock={() => toggleLock('bulletOpacity')}
          />
          <LockableSlider label="Roughness"
            value={roughness} onChange={e => setRoughness(+e.target.value)}
            min={0} max={0.6} step={0.01} locked={locks.roughness}
            onToggleLock={() => toggleLock('roughness')}
          />
        </div>

        <div className="section-header">GLASS / REFRACTION</div>
        <div className="controls">
          <LockableSlider label="Glass Opacity"
            value={glassOpacity} onChange={e => setGlassOpacity(+e.target.value)}
            min={0} max={1} step={0.05} locked={locks.glassOpacity}
            onToggleLock={() => toggleLock('glassOpacity')}
          />
          <LockableSlider label="Glass Strength"
            value={glassStrength} onChange={e => setGlassStrength(+e.target.value)}
            min={0} max={1.5} step={0.05} locked={locks.glassStrength}
            onToggleLock={() => toggleLock('glassStrength')}
          />
          <LockableSlider label="IOR (Refraction)"
            value={ior} onChange={e => setIor(+e.target.value)}
            min={1.0} max={2.5} step={0.05} locked={locks.ior}
            onToggleLock={() => toggleLock('ior')}
          />
          <LockableSlider label="Refract Strength"
            value={refractStrength} onChange={e => setRefractStrength(+e.target.value)}
            min={0} max={1.5} step={0.05} locked={locks.refractStrength}
            onToggleLock={() => toggleLock('refractStrength')}
          />
        </div>

        <div className="section-header">FOG</div>
        <div className="controls">
          <LockableSlider label="Fog Density"
            value={fogAmount} onChange={e => setFogAmount(+e.target.value)}
            min={0} max={1} step={0.05} locked={locks.fogAmount}
            onToggleLock={() => toggleLock('fogAmount')}
          />
        </div>

        <div className="note">
          👁️ <strong>Visibility fix:</strong> The back plane is now light gray (adjustable) so additive glow
          is visible against it. Glow uses 3-pass bright source drawing, double blur, saturation boost, and
          'lighter' composite mode. All masked to voxel surfaces only.
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
